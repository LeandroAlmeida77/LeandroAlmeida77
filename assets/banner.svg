<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="220" viewBox="0 0 1000 220" role="img" aria-label="Leandro Almeida - ADS FIVJ, Dados e Tecnologia" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1b27"/>
      <stop offset="1" stop-color="#2a3050"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7aa2f7"/>
      <stop offset="1" stop-color="#bb9af7"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="220" rx="16" fill="url(#bg)"/>

  <text x="500" y="98" text-anchor="middle" font-family="'Segoe UI', Ubuntu, Helvetica, Arial, sans-serif" font-size="56" font-weight="700" fill="#c0caf5">Leandro Almeida</text>
  <rect x="380" y="116" width="240" height="4" rx="2" fill="url(#accent)"/>

  <g font-family="'Fira Code', Consolas, 'Courier New', monospace" font-size="22" text-anchor="middle">
    <text x="500" y="165" fill="#7aa2f7" opacity="0">
      <tspan fill="#bb9af7">&gt; </tspan>ADS - FIVJ
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.02;0.22;0.25;1" dur="12s" repeatCount="indefinite"/>
    </text>
    <text x="500" y="165" fill="#7aa2f7" opacity="0">
      <tspan fill="#bb9af7">&gt; </tspan>Dados &amp; Tecnologia
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.25;0.27;0.47;0.5;1" dur="12s" repeatCount="indefinite"/>
    </text>
    <text x="500" y="165" fill="#7aa2f7" opacity="0">
      <tspan fill="#bb9af7">&gt; </tspan>Web &amp; Software
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5;0.52;0.72;0.75;1" dur="12s" repeatCount="indefinite"/>
    </text>
    <text x="500" y="165" fill="#7aa2f7" opacity="0">
      <tspan fill="#bb9af7">&gt; </tspan>Estudante focado em Banco de Dados
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.75;0.77;0.97;1" dur="12s" repeatCount="indefinite"/>
    </text>
  </g>
</svg>
